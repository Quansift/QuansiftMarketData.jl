name: CI
on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:
    workflow_dispatch:
jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        env:
            TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY || 'mock-api-key-for-testing' }}
            JULIA_NUM_THREADS: "auto"
            JULIA_PROJECT: "."
        permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "1.9"
                    - "1.12"
                os:
                    - ubuntu-latest
                    - macos-latest
                exclude:
                    - version: "1.9"
                      os: macos-latest
                # arch is auto-detected by julia-actions/setup-julia based on
                # the runner OS (ubuntu-latest -> x64, macos-latest -> aarch64).
                # Hardcoding `x64` broke macos-latest after GitHub migrated the
                # default macOS runner to Apple Silicon.
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  # arch omitted; setup-julia auto-detects the runner architecture.
            - name: Validate release hygiene
              run: |
                  julia --project=. scripts/ci/validate_release_hygiene.jl
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            - name: Setup test environment
              run: |
                  # Ensure a directory exists for temporary DuckDB files
                  mkdir -p .duckdb_temp
            - name: Install and resolve dependencies
              run: |
                  julia --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.resolve(); Pkg.precompile()'
                  julia --project=. -e 'using TimeSeries; println("TimeSeries loaded successfully")'
            - name: Verify test environment
              run: |
                  julia --code-coverage=user --project=. test/runtests.jl
            - name: Build production image
              if: runner.os == 'Linux' && matrix.version == '1.12'
              run: |
                  docker build -f docker/Dockerfile .
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v7
              with:
                  file: lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false
    postgres-integration:
        name: PostgreSQL 17 integration - ubuntu
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            JULIA_PROJECT: "."
            TIINGO_API_KEY: mock-api-key-for-testing
            TIINGO_TEST_PG_CONNECTION: postgresql://postgres:postgres@localhost:5432/tiingojulia_test?sslmode=disable
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: tiingojulia_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d tiingojulia_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: "1.12"
            - uses: julia-actions/cache@v3
            - name: Install and resolve dependencies
              run: |
                  julia --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'
            - name: Preinstall DuckDB PostgreSQL extension
              run: |
                  julia --project=. -e 'using DBInterface, DuckDB; conn = DBInterface.connect(DuckDB.DB); try DBInterface.execute(conn, "INSTALL postgres") finally DBInterface.close!(conn) end'
            - name: Run PostgreSQL persistence integration
              run: |
                  julia --project=. test/test_postgres_integration.jl

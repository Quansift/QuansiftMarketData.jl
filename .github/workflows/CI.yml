name: CI
on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:
    workflow_dispatch:
jobs:
    release-tag-policy:
        name: Classify release tag
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            eligible: ${{ steps.classify.outputs.eligible }}
        steps:
            - name: Allow non-tag events and stable release tags
              id: classify
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  elif [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "eligible=false" >> "${GITHUB_OUTPUT}"
                  fi
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
        needs: release-tag-policy
        if: needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        env:
            TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY || 'mock-api-key-for-testing' }}
            TIINGO_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
            JULIA_NUM_THREADS: "auto"
            JULIA_PROJECT: "."
        permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "1.9"
                    - "1.12"
                os:
                    - ubuntu-latest
                    - macos-latest
                exclude:
                    - version: "1.9"
                      os: macos-latest
                # arch is auto-detected by julia-actions/setup-julia based on
                # the runner OS (ubuntu-latest -> x64, macos-latest -> aarch64).
                # Hardcoding `x64` broke macos-latest after GitHub migrated the
                # default macOS runner to Apple Silicon.
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
              with:
                  version: ${{ matrix.version }}
                  # arch omitted; setup-julia auto-detects the runner architecture.
            - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
            - name: Resolve dependencies for the active Julia version
              run: |
                  julia --project=. -e '
                    import Pkg
                    manifest_path = joinpath(dirname(Base.active_project()), "Manifest.toml")
                    if VERSION < v"1.12" && isfile(manifest_path)
                        rm(manifest_path)
                    end
                    Pkg.resolve(); Pkg.instantiate(); Pkg.precompile()'
            - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
            - name: Setup test environment
              run: |
                  # Ensure a directory exists for temporary DuckDB files
                  mkdir -p .duckdb_temp
            - name: Verify resolved dependency environment
              run: julia --project=. -e 'using TimeSeries; println("TimeSeries loaded successfully")'
            - name: Validate release hygiene
              run: julia --project=. scripts/ci/validate_release_hygiene.jl
            - name: Verify test environment
              run: |
                  julia --code-coverage=user --project=. test/runtests.jl
            - name: Build production image
              if: runner.os == 'Linux' && matrix.version == '1.12'
              run: |
                  docker build -f docker/Dockerfile .
            - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
            - uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
              with:
                  file: lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false
    postgres-integration:
        name: PostgreSQL 17 integration - ubuntu
        needs: release-tag-policy
        if: needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            JULIA_PROJECT: "."
            TIINGO_API_KEY: mock-api-key-for-testing
            TIINGO_TEST_PG_CONNECTION: postgresql://postgres:postgres@localhost:5432/tiingojulia_test?sslmode=disable
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: tiingojulia_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d tiingojulia_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
              with:
                  version: "1.12"
            - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
            - name: Install and resolve dependencies
              run: |
                  julia --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'
            - name: Preinstall DuckDB PostgreSQL extension
              run: |
                  julia --project=. -e 'using DBInterface, DuckDB; conn = DBInterface.connect(DuckDB.DB); try DBInterface.execute(conn, "INSTALL postgres") finally DBInterface.close!(conn) end'
            - name: Run PostgreSQL persistence integration
              run: |
                  julia --project=. test/test_postgres_integration.jl
    benchmark-smoke:
        name: One-sample benchmark smoke - Julia 1.12 - ubuntu
        needs: release-tag-policy
        if: >-
            github.event_name == 'pull_request' &&
            needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        env:
            TIINGO_BENCH_TICKERS: "1"
            TIINGO_BENCH_DAYS: "2"
            TIINGO_BENCH_SAMPLES: "1"
            TIINGO_BENCH_ITERATIONS: "1"
            TIINGO_BENCH_MAX_ELAPSED_SECONDS: "90"
            TIINGO_BENCH_SINK: local
            TIINGO_BENCH_OUTPUT: benchmark/micro-result.json
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
              with:
                  version: "1.12"
            - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
            - name: Instantiate benchmark environment
              run: >-
                  julia --project=benchmark -e
                  'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
            - name: Run one-sample benchmark smoke
              run: julia --project=benchmark benchmark/run.jl micro

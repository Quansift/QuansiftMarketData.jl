name: Lint and Link Check

on:
    push:
        branches: [main]
        tags: ["*"]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    release-tag-policy:
        name: Classify release tag
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            eligible: ${{ steps.classify.outputs.eligible }}
        steps:
            - name: Allow non-tag events and stable release tags
              id: classify
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  elif [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "eligible=false" >> "${GITHUB_OUTPUT}"
                  fi
    lint:
        name: Linting
        needs: release-tag-policy
        if: needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3
              with:
                  version: "1.12"
            - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
            - name: Install JuliaFormatter
              run: julia -e 'using Pkg; pkg"add JuliaFormatter"'
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  cache: "pip"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/pre-commit
                  key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
            - run: pip install pre-commit
            - name: Run pre-commit
              run: SKIP=no-commit-to-branch pre-commit run -a

    link-checker:
        name: Link Checker
        needs: release-tag-policy
        if: needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0

              with:
                  fail: true
                  args: --config '.lychee.toml' README.md CHANGELOG.md CLAUDE.md AGENTS.md docs/architecture docs/src

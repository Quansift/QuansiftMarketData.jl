name: Lint and Link Check

on:
    push:
        branches: [main]
        tags: ["*"]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    release-tag-policy:
        name: Classify release tag
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            eligible: ${{ steps.classify.outputs.eligible }}
        steps:
            - name: Allow non-tag events and stable release tags
              id: classify
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  elif [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "eligible=false" >> "${GITHUB_OUTPUT}"
                  fi
    lint:
        name: Linting
        needs: release-tag-policy
        if: needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
            - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
              with:
                  version: "1.12"
            - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
            - name: Install JuliaFormatter
              run: julia -e 'using Pkg; pkg"add JuliaFormatter"'
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  cache: "pip"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/pre-commit
                  key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
            - run: pip install pre-commit
            - name: Run pre-commit
              run: SKIP=no-commit-to-branch pre-commit run -a

    link-checker:
        name: Link Checker
        needs: release-tag-policy
        if: needs.release-tag-policy.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
            - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0

              with:
                  fail: true
                  args: --config '.lychee.toml' README.md CHANGELOG.md PRODUCTION.md CLAUDE.md AGENTS.md docs/src

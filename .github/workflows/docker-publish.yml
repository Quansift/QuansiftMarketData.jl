name: Publish image

# Builds the production image and pushes it to GHCR so droplets can pull
# (instead of building Julia/precompile on a memory-constrained droplet).
# Tags: branch name (e.g. `staging`, `main`), `sha-<short>`, version on git tags,
# and `latest` on main.
on:
    push:
        branches:
            - main
            - staging
        tags: ["*"]
    workflow_dispatch:

jobs:
    build-push:
        name: Build and push to GHCR
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            - uses: docker/setup-buildx-action@v3
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Derive image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/tiingojulia
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

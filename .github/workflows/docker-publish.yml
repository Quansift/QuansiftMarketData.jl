name: Publish image

# Builds the production image and pushes it to GHCR so droplets can pull
# (instead of building Julia/precompile on a memory-constrained droplet).
# Tags: branch name (e.g. `staging`, `main`), `sha-<short>`, stable semantic
# version on exact `vX.Y.Z` git tags, and `latest` on main.
on:
    push:
        branches:
            - main
            - staging
        tags: ["*"]
    workflow_dispatch:

jobs:
    release-gate:
        name: Classify tag and verify release preflight
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            statuses: read
        outputs:
            eligible: ${{ steps.classify.outputs.eligible }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - name: Allow non-tag events and stable release tags
              id: classify
              shell: bash
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  elif [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "eligible=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "eligible=false" >> "${GITHUB_OUTPUT}"
                  fi
            - name: Verify exact tag commit release preflight
              if: github.ref_type == 'tag' && steps.classify.outputs.eligible == 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag_commit="$(git rev-parse 'HEAD^{commit}')"
                  context="quansift-market-data/release-preflight/${GITHUB_REF_NAME}"
                  expected_title="Release preflight ${GITHUB_REF_NAME} @ ${tag_commit}"
                  status_fields="$(gh api \
                    -H 'Accept: application/vnd.github+json' \
                    "/repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/statuses?per_page=100" \
                    --jq "(map(select(.context == \"${context}\"))[0] // {}) |
                      [.state // \"\", .creator.login // \"\", .target_url // \"\"] |
                      @tsv")"
                  IFS=$'\t' read -r state creator target_url <<< "${status_fields}"
                  [[ "${state}" == "success" ]]
                  [[ "${creator}" == "github-actions[bot]" ]]
                  run_url_prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/"
                  [[ "${target_url}" == "${run_url_prefix}"* ]]
                  run_id="${target_url#"${run_url_prefix}"}"
                  [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
                  [[ "${target_url}" == "${run_url_prefix}${run_id}" ]]
                  verified_run_id="$(gh api \
                    -H 'Accept: application/vnd.github+json' \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                    --jq "select(
                      (.id | tostring) == \"${run_id}\" and
                      .path == \".github/workflows/release-preflight.yml\" and
                      .head_branch == \"main\" and
                      .display_title == \"${expected_title}\" and
                      .head_sha == \"${tag_commit}\" and
                      .event == \"workflow_dispatch\" and
                      .status == \"completed\" and
                      .conclusion == \"success\"
                    ) | .id")"
                  [[ "${verified_run_id}" == "${run_id}" ]]
    build-push:
        name: Build and push to GHCR
        needs: release-gate
        if: >-
            needs.release-gate.result == 'success' &&
            needs.release-gate.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Derive image tags
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/quansiftmarketdata
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=sha
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

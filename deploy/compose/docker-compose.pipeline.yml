# Tiingo data pipeline — oneshot run on the shared DB network.
#
# Run on a droplet (from the repo root):
#   docker compose -f deploy/compose/docker-compose.pipeline.yml run --rm pipeline
#
# One-off smoke overrides must be passed to the container with `run -e`.
# Prefix env vars before `docker compose` only affect Compose interpolation and
# do not override values loaded from the service env_file.
#   docker compose -f deploy/compose/docker-compose.pipeline.yml run --rm \
#     -e TIINGO_SMOKE_TICKER_LIMIT=100 \
#     -e TIINGO_SMOKE_EXPORT_POSTGRES=false \
#     pipeline
#
# Requires:
#   - The external Docker network the DB stack exposes (preprod: `db-net`).
#   - An env file at the repo root (preprod: `.env.staging`) providing
#     TIINGO_API_KEY and OHLCV_PG_CONNECTION (or legacy TIINGO_PG_CONNECTION). The PG host MUST be the
#     in-network service alias on port 5432 (e.g. postgres:5432 / postgres_db:5432),
#     NOT the host-published 127.0.0.1:5433. SSL is typically off in-network:
#       TIINGO_PG_CONNECTION=postgresql://USER:PASS@postgres:5432/DB?sslmode=disable
#       TIINGO_SMOKE_EXPORT_POSTGRES=true
#
# Image tag and env file are overridable:
#   TIINGO_IMAGE_REPO=ghcr.io/quansift/tiingojulia TIINGO_IMAGE_TAG=latest TIINGO_APP_ENV_FILE=../../.env docker compose -f ... run --rm pipeline

services:
    pipeline:
        image: ${TIINGO_IMAGE_REPO:-ghcr.io/quansift/tiingojulia}:${TIINGO_IMAGE_TAG:-staging}
        # ENTRYPOINT is `julia --project=/app`; this is the script it runs.
        # Swap for the full-sync entrypoint once one exists under scripts/.
        command: ["scripts/staging_smoke_test.jl"]
        env_file:
            - ${TIINGO_APP_ENV_FILE:-../../.env.staging}
        environment:
            # Respect OHLCV_DUCKDB_PATH (or legacy TIINGO_DB_PATH) from the selected app env file.
            # Only container-local scratch files are forced into /tmp.
            TIINGO_DUCKDB_TMP: /tmp
            TIINGO_TICKERS_ZIP: /tmp/supported_tickers.zip
            TIINGO_TICKERS_CSV: /tmp/supported_tickers.csv
        networks:
            - db-net
        restart: "no"
        volumes:
            - ${TIINGO_DB_HOST_DIR:-../../data}:${TIINGO_DB_CONTAINER_DIR:-/data}

networks:
    # Provided by the DB stack; not created by this compose file.
    db-net:
        name: ${TIINGO_DOCKER_NETWORK:-db-net}
        external: true
